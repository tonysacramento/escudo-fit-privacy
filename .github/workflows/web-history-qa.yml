name: Escudo Fit Web History Contract QA

on:
  push:
    branches:
      - work/web-v42-full-history-qa-20261008
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web JavaScript syntax
        run: |
          node --check app/history-sync-contract.js
          node --check app/app.js
          node --check app/sw.js
      - name: Seven-category history contract tests
        run: node --test test/history-sync-contract.test.mjs
      - name: No production Android deployment in Web QA
        run: echo 'Web-only QA, no Android APK or AAB built.'
