name: Private v2 checkout QA (NO LIVE)
on:
  pull_request:
    branches: [main]
    paths: ['app/pilot-pix/v2/**', 'test/private-v2.test.mjs', 'qa/web-private-v2.spec.mjs', '.github/workflows/web-private-v2-qa.yml']
  push:
    branches: [main]
    paths: ['app/pilot-pix/v2/**', 'test/private-v2.test.mjs', 'qa/web-private-v2.spec.mjs', '.github/workflows/web-private-v2-qa.yml']
permissions:
  contents: read
jobs:
  private-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate one-case client safety
        run: |
          node --check app/pilot-pix/v2/private-v2.mjs
          node --test test/private-v2.test.mjs
      - name: Install browser QA only
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve isolated static QA
        run: |
          python3 -m http.server 4173 --directory . >/tmp/private-v2-qa.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/app/pilot-pix/v2/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Mobile and desktop mock purchase; no LIVE provider or mail
        run: npx playwright test qa/web-private-v2.spec.mjs --reporter=line
      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-v2-web-qa
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
