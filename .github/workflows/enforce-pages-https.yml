name: Escudo Fit Enforce HTTPS (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/enforce-pages-https.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify certificate approved, enable HTTPS, confirm settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          url=f"https://api.github.com/repos/{os.environ['REPO']}/pages"
          headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
          }
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:before=json.load(r)
          assert before.get('cname')=='escudofit.com.br','CUSTOM_DOMAIN_CHANGED'
          assert (before.get('https_certificate') or {}).get('state')=='approved','CERTIFICATE_NOT_APPROVED'
          print('PRECONDITION_CUSTOM_DOMAIN=PASS')
          print('PRECONDITION_CERT_APPROVED=PASS')
          if not before.get('https_enforced'):
            payload=json.dumps({'https_enforced':True}).encode()
            req=urllib.request.Request(url,data=payload,method='PUT',headers={**headers,'Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                assert r.status==204,('UPDATE_UNEXPECTED',r.status)
              print('HTTPS_ENFORCEMENT_UPDATE=ACCEPTED')
            except urllib.error.HTTPError as e:
              print('HTTPS_ENFORCEMENT_UPDATE=BLOCKED_HTTP_'+str(e.code))
              raise
          else:print('HTTPS_ALREADY_ENFORCED=True')
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:after=json.load(r)
          assert after.get('https_enforced')==True,'HTTPS_ENFORCEMENT_NOT_CONFIRMED'
          assert after.get('cname')=='escudofit.com.br','DOMAIN_UNEXPECTED'
          print('HTTPS_ENFORCED=PASS')
          PY
