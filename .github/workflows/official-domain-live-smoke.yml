name: Escudo Fit Official Domain Live Smoke (Read Only)

on:
  push:
    branches: [qa/custom-domain-live-web-20261013]
    paths: ['.github/workflows/official-domain-live-smoke.yml']

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS public pages, approved icon, login and API CORS
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,ssl
          ctx=ssl.create_default_context()
          urls=[
            ('HOME','https://escudofit.com.br/',('Escudo Fit','R$ 4,99','R$ 49,90')),
            ('APP','https://escudofit.com.br/app/',('webAccessGate','google')),
            ('PRIVACY','https://escudofit.com.br/privacy.html',()),
            ('TERMS','https://escudofit.com.br/terms.html',()),
            ('SUPPORT','https://escudofit.com.br/support.html',()),
            ('APP_JS','https://escudofit.com.br/app/app.js?v=web-v43-pricing-17',('GOOGLE_CLIENT_ID','https://escudo-fit-api-v38-835029473980.us-central1.run.app')),
            ('LOGO','https://escudofit.com.br/app/icon-approved-v43.png',()),
          ]
          for label,url,expected in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'EscudoFitOfficialSmoke/1.0'})
            with urllib.request.urlopen(req,timeout=25,context=ctx) as r:
              body=r.read(200000)
              assert r.status==200,(label,r.status)
              assert all(v in body.decode('utf-8','replace') for v in expected),(label,'EXPECTED_CONTENT_MISSING')
              print(label+'_HTTPS_200=PASS')
          base='https://escudo-fit-api-v38-835029473980.us-central1.run.app'
          for route,method,headers in (
             ('/api/v38/auth/google','POST','content-type'),
             ('/api/v38/history','GET','authorization'),
             ('/api/v38/entitlement/me','GET','authorization'),
          ):
            req=urllib.request.Request(base+route,method='OPTIONS',headers={
              'Origin':'https://escudofit.com.br',
              'Access-Control-Request-Method':method,
              'Access-Control-Request-Headers':headers,
            })
            with urllib.request.urlopen(req,timeout=25,context=ctx) as r:
              assert r.status==204,(route,r.status)
              assert r.headers.get('access-control-allow-origin')=='https://escudofit.com.br',(route,'CORS')
              print(route+'_CORS=PASS')
          for route in ('/api/v38/history','/api/v38/entitlement/me'):
            req=urllib.request.Request(base+route)
            try:
              with urllib.request.urlopen(req,timeout=25,context=ctx) as r: status=r.status
            except urllib.error.HTTPError as e:status=e.code
            assert status==401,(route,status)
            print(route+'_AUTH_PROTECTED=PASS')
          print('GOOGLE_INTERACTIVE_LOGIN=NOT_TESTED_WITH_REAL_USER')
          print('TEST_MODE=READ_ONLY')
          PY
